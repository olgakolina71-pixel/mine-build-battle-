<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mine Build Battle — Architect</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101820;color:#edf4f7}body{max-width:760px;margin:auto;padding:18px}h1{font-size:1.6rem}section{background:#1c2b36;border:1px solid #314553;border-radius:14px;padding:16px;margin:14px 0}label{display:block;margin:12px 0 5px}input,button,textarea{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;border:1px solid #49606f;background:#101820;color:inherit;font:inherit}button{background:#26734c;border:0;font-weight:700;margin-top:12px;cursor:pointer}button.secondary{background:#36566b}textarea{min-height:170px;font-family:monospace;font-size:13px}small{color:#a9c0cc}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{white-space:pre-wrap;color:#aee5c5}@media(max-width:500px){.row{grid-template-columns:1fr}}</style>
<body><h1>🏗️ Mine Build Battle Architect</h1><p>Мобильный генератор чертежей Minecraft Bedrock.</p><section>
<label>URL backend API</label><input id="api" placeholder="https://your-backend.example"><small>Ключ модели хранится только на сервере.</small>
<label>Тема</label><input id="theme" value="Дом на дереве в джунглях"><label>Стиль</label><input id="style" value="Minecraft fantasy, детализированная архитектура">
<div class="row"><div><label>Размер по осям</label><input id="size" type="number" min="5" max="40" value="20"></div><div><label>Бюджет блоков</label><input id="budget" type="number" min="50" max="2000" value="1500"></div></div><button id="generate">Создать чертёж</button><p class="status" id="status"></p></section>
<section id="result" hidden><h2>Результат</h2><p id="stats"></p><canvas id="preview" width="720" height="480" style="width:100%;background:#0b1218;border-radius:10px"></canvas><p><small>Изометрический предпросмотр (условные цвета блоков).</small></p><div class="row"><button class="secondary" id="json">Скачать JSON</button><button class="secondary" id="mcfunction">Экспорт .mcfunction</button></div><label>Чертёж JSON</label><textarea id="blueprint" readonly></textarea><label>Команды Minecraft</label><textarea id="commands" readonly></textarea><button class="secondary" id="copy">Копировать команды</button></section>
<script>
const $=id=>document.getElementById(id);let bp=null;
$("generate").onclick=async()=>{const base=$("api").value.trim().replace(/\/$/,"");if(!base){$("status").textContent="Укажи URL backend.";return}$("status").textContent="Генерирую…";$("generate").disabled=true;$("result").hidden=true;try{const r=await fetch(base+"/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({theme:$("theme").value,style:$("style").value,size:Number($("size").value),block_budget:Number($("budget").value)})});const d=await r.json();if(!r.ok)throw Error(d.detail||r.status);bp=d.blueprint;$("blueprint").value=JSON.stringify(bp,null,2);drawPreview(bp);$("stats").textContent=(bp.name||"Постройка")+" · "+d.block_count+" блоков · размер "+bp.size.x+"×"+bp.size.y+"×"+bp.size.z;$("result").hidden=false;$("status").textContent="Чертёж прошёл проверку."}catch(e){$("status").textContent="Ошибка: "+e.message}finally{$("generate").disabled=false}};
$("json").onclick=()=>download("blueprint.json",JSON.stringify(bp,null,2));$("mcfunction").onclick=async()=>{try{const r=await fetch($("api").value.trim().replace(/\/$/,"")+"/export/mcfunction",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(bp)});const d=await r.json();if(!r.ok)throw Error(d.detail||r.status);$("commands").value=d.content;download(d.filename,d.content)}catch(e){$("status").textContent="Экспорт: "+e.message}};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("commands").value);$("status").textContent="Скопировано"}catch{$("status").textContent="Выдели команды и скопируй вручную"}};function drawPreview(b){const canvas=$("preview"),ctx=canvas.getContext("2d");const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle="#0b1218";ctx.fillRect(0,0,w,h);const sx=Math.min(13,Math.max(5,Math.floor(520/(b.size.x+b.size.z)))),sy=sx*.52;const ox=w/2,oy=h-48;const colors={"minecraft:stone":"#87939c","minecraft:cobblestone":"#69747d","minecraft:oak_planks":"#b78b51","minecraft:spruce_planks":"#80603a","minecraft:oak_log":"#735132","minecraft:bricks":"#a95c52","minecraft:stone_bricks":"#8d9295","minecraft:glass":"#b8e4f4","minecraft:oak_leaves":"#43834a","minecraft:grass_block":"#65a34b","minecraft:dirt":"#79533a","minecraft:sand":"#d6c17a","minecraft:water":"#4c9dd9","minecraft:lantern":"#ffc75b","minecraft:torch":"#ffb84c","minecraft:white_wool":"#eee9df","minecraft:red_wool":"#c64b48","minecraft:blue_wool":"#4d78c5"};const blocks=[...b.blocks].sort((a,c)=>(a.x+a.z)-(c.x+c.z)||a.y-c.y);for(const q of blocks){const x=ox+(q.x-q.z)*sx, y=oy-(q.x+q.z)*sy-q.y*sx;const color=colors[q.block]||"#888";ctx.fillStyle=color;ctx.strokeStyle="rgba(0,0,0,.16)";ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+sx,y+sy);ctx.lineTo(x,y+sy*2);ctx.lineTo(x-sx,y+sy);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x-sx,y+sy);ctx.lineTo(x,y+sy*2);ctx.lineTo(x,y+sy*2+sx*.7);ctx.lineTo(x-sx,y+sy+sx*.7);ctx.closePath();ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x+sx,y+sy);ctx.lineTo(x,y+sy*2);ctx.lineTo(x,y+sy*2+sx*.7);ctx.lineTo(x+sx,y+sy+sx*.7);ctx.closePath();ctx.fill()}}
function download(n,t){const a=document.createElement("a"),u=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}
</script></body></html>
